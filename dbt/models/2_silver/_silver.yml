version: 2

models:
  - name: clientes
    description: Um registro por cliente, padronizado. Camada restrita, porque ainda tem nome e e-mail.
    columns:
      - name: id_cliente
        data_tests: [unique, not_null]
      - name: uf
        data_tests:
          - accepted_values:
              arguments:
                values: [SP, RJ, MG, AL, BA, PE]

  - name: vendas_padronizadas
    description: Vendas tipadas e sem duplicata, com o motivo de reprovação. Alimenta vendas e quarentena_vendas.

  - name: vendas
    description: Vendas que passaram em todas as regras de qualidade.
    columns:
      - name: id_venda
        data_tests: [unique, not_null]
      - name: data_venda
        data_tests: [not_null]
      - name: produto
        data_tests: [not_null]
      - name: categoria
        data_tests: [not_null]
      - name: quantidade
        data_tests: [not_null]
      - name: preco_unitario
        data_tests: [not_null]
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [pago, cancelado, pendente]
      - name: id_cliente
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('clientes')
                field: id_cliente

  - name: quarentena_vendas
    description: Vendas reprovadas, com o motivo. Nada é apagado.
    columns:
      - name: motivo
        data_tests: [not_null]

  - name: perfil_dados
    description: Perfil de cada coluna (tipo, mínimo, máximo, distintos, nulos) na bronze e na silver.

  - name: qualidade
    description: Placar da limpeza, com linhas de entrada, de saída e cada motivo de reprovação.

unit_tests:
  - name: limpeza_entende_todos_os_formatos_sujos
    description: O mesmo dado escrito de jeitos diferentes vira um valor só, e a duplicata sai.
    model: vendas_padronizadas
    given:
      - input: ref('bronze_vendas')
        rows:
          - {id_venda: "1", data_venda: "31/12/2025", id_cliente: " c0001", produto: " NOTEBOOK ", categoria: "eletronicos", quantidade: "2", preco_unitario: "R$ 3.500,90", status: " PAGO ", _linha: 2}
          - {id_venda: "2", data_venda: "2025-12-31", id_cliente: "C0001", produto: "notebook", categoria: "Eletrônicos", quantidade: "2", preco_unitario: "3500,90", status: "pago", _linha: 3}
          - {id_venda: "3", data_venda: "31-12-2025", id_cliente: "C0001", produto: "Notebook  ", categoria: "ELETRÔNICOS", quantidade: "2", preco_unitario: "3500.9", status: "Pago  ", _linha: 4}
          - {id_venda: "1", data_venda: "31/12/2025", id_cliente: " c0001", produto: " NOTEBOOK ", categoria: "eletronicos", quantidade: "2", preco_unitario: "R$ 3.500,90", status: " PAGO ", _linha: 9}
      - input: ref('dominio_categoria')
        rows:
          - {chave: ELETRONICOS, categoria: Eletrônicos}
      - input: ref('clientes')
        rows:
          - {id_cliente: C0001}
    expect:
      rows:
        - {id_venda: 1, data_venda: 2025-12-31, id_cliente: C0001, produto: Notebook, categoria: Eletrônicos, quantidade: 2, preco_unitario: 3500.90, status: pago, motivo: null}
        - {id_venda: 2, data_venda: 2025-12-31, id_cliente: C0001, produto: Notebook, categoria: Eletrônicos, quantidade: 2, preco_unitario: 3500.90, status: pago, motivo: null}
        - {id_venda: 3, data_venda: 2025-12-31, id_cliente: C0001, produto: Notebook, categoria: Eletrônicos, quantidade: 2, preco_unitario: 3500.90, status: pago, motivo: null}

  - name: regras_de_qualidade_apontam_cada_motivo
    description: Cada linha reprovada diz por quê, e uma linha com dois problemas mostra os dois.
    model: vendas_padronizadas
    given:
      - input: ref('bronze_vendas')
        rows:
          - {id_venda: "1", data_venda: "31/02/2025", id_cliente: "C0001", produto: "Livro", categoria: "Livros", quantidade: "1", preco_unitario: "50", status: "pago", _linha: 2}
          - {id_venda: "2", data_venda: "2025-01-10", id_cliente: "C0001", produto: "Livro", categoria: "Livros", quantidade: "dois", preco_unitario: "50", status: "pago", _linha: 3}
          - {id_venda: "3", data_venda: "2025-01-10", id_cliente: "C0001", produto: "Livro", categoria: "Livros", quantidade: "1", preco_unitario: "N/A", status: "pago", _linha: 4}
          - {id_venda: "4", data_venda: "2025-01-10", id_cliente: "C9999", produto: "Livro", categoria: "Livros", quantidade: "1", preco_unitario: "50", status: "pago", _linha: 5}
          - {id_venda: "5", data_venda: "2025-01-10", id_cliente: "C0001", produto: "Livro", categoria: "brinquedos", quantidade: "1", preco_unitario: "50", status: "pago", _linha: 6}
          - {id_venda: "6", data_venda: "2025-01-10", id_cliente: "C0001", produto: "Livro", categoria: "Livros", quantidade: "0", preco_unitario: "-", status: "pago", _linha: 7}
          - {id_venda: "7", data_venda: "2025-01-10", id_cliente: "C0001", produto: "Livro", categoria: "Livros", quantidade: "1", preco_unitario: "5000", status: "pago", _linha: 8}
          - {id_venda: "8", data_venda: "2025-01-10", id_cliente: "C0001", produto: "Livro", categoria: "Livros", quantidade: "1", preco_unitario: "50", status: "pago", _linha: 9}
          - {id_venda: "9", data_venda: "2025-01-10", id_cliente: "C0001", produto: "", categoria: "Livros", quantidade: "1", preco_unitario: "50", status: "pago", _linha: 10}
          - {id_venda: "10", data_venda: "2025-01-10", id_cliente: "C0001", produto: "Livro", categoria: "Livros", quantidade: "1", preco_unitario: "50", status: "estornado", _linha: 11}
          - {id_venda: "11", data_venda: "2025-01-10", id_cliente: "C0001", produto: "Livro", categoria: "Livros", quantidade: "1", preco_unitario: "50", status: "", _linha: 12}
      - input: ref('dominio_categoria')
        rows:
          - {chave: LIVROS, categoria: Livros}
      - input: ref('clientes')
        rows:
          - {id_cliente: C0001}
    expect:
      rows:
        - {id_venda: 1, motivo: data_invalida}
        - {id_venda: 2, motivo: quantidade_invalida}
        - {id_venda: 3, motivo: preco_invalido}
        - {id_venda: 4, motivo: cliente_inexistente}
        - {id_venda: 5, motivo: categoria_invalida}
        - {id_venda: 6, motivo: quantidade_invalida;preco_invalido}
        - {id_venda: 7, motivo: preco_outlier}
        - {id_venda: 8, motivo: null}
        - {id_venda: 9, motivo: produto_invalido}
        - {id_venda: 10, motivo: status_invalido}
        - {id_venda: 11, motivo: status_invalido}

  - name: clientes_padroniza_uf_nome_e_email
    description: UF por extenso vira sigla, nome ganha maiúscula, e-mail inválido vira nulo, e a duplicata sai.
    model: clientes
    given:
      - input: ref('bronze_clientes')
        rows:
          - {id_cliente: " c0001", nome: " ana SILVA ", email: "Ana@Email.com", uf: "São Paulo", data_cadastro: "01/02/2024", _linha: 2}
          - {id_cliente: "C0002", nome: "JOÃO LIMA", email: "joaoemail.com", uf: "N/A", data_cadastro: "2024-02-01", _linha: 3}
          - {id_cliente: "C0001", nome: "Ana Silva", email: "ana@email.com", uf: "sp", data_cadastro: "2024/02/01", _linha: 4}
      - input: ref('dominio_uf')
        rows:
          - {chave: SAO PAULO, uf: SP}
          - {chave: SP, uf: SP}
    expect:
      rows:
        - {id_cliente: C0001, nome: Ana Silva, email: ana@email.com, uf: SP, data_cadastro: 2024-02-01}
        - {id_cliente: C0002, nome: João Lima, email: null, uf: null, data_cadastro: 2024-02-01}
