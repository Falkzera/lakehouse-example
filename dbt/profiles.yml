# LAKEHOUSE vem do pipeline/run.py; rodando o dbt de dentro desta pasta, vale o padrão ../lakehouse
lakehouse:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('LAKEHOUSE', '../lakehouse') }}/catalogo.duckdb"
      external_root: "{{ env_var('LAKEHOUSE', '../lakehouse') }}"
      threads: 4
