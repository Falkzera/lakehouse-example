name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline e testes
    runs-on: ubuntu-latest  # repositório público: o runner do GitHub não consome cota
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Dependências
        run: pip install -r requirements.txt
      - name: Testes da ingestão (pytest)
        run: pytest
      - name: Gera a fonte suja
        run: python pipeline/gerar_dados.py
      - name: Ingestão na bronze
        run: python pipeline/run.py
